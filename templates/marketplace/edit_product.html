{% extends "base.html" %}

{% block title %}
    Edit Product | KisanBasket
{% endblock %}

{% block content %}

<section class="container py-5">

    <div class="mb-4">
        <a
            href="{% url 'farmer_products' %}"
            class="text-success text-decoration-none"
        >
            ← Back to My Products
        </a>

        <h1 class="fw-bold mt-3">
            ✏️ Edit Product
        </h1>

        <p class="text-muted">
            Update your product information.
        </p>
    </div>


    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card border-0 shadow-sm">

                <div class="card-body p-4 p-md-5">

                    <form
                        method="POST"
                        enctype="multipart/form-data"
                    >

                        {% csrf_token %}


                        <!-- Product Name -->

                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Product Name
                            </label>

                            <input
                                type="text"
                                name="name"
                                class="form-control"
                                value="{{ product.name }}"
                                required
                            >

                        </div>


                        <!-- Description -->

                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Description
                            </label>

                            <textarea
                                name="description"
                                class="form-control"
                                rows="4"
                                required
                            >{{ product.description }}</textarea>

                        </div>


                        <div class="row">

                            <!-- Price -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label fw-semibold">
                                    Price (₹)
                                </label>

                                <input
                                    type="number"
                                    name="price"
                                    class="form-control"
                                    value="{{ product.price }}"
                                    step="0.01"
                                    min="0.01"
                                    required
                                >

                            </div>


                            <!-- Quantity -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label fw-semibold">
                                    Quantity
                                </label>

                                <input
                                    type="number"
                                    name="quantity"
                                    class="form-control"
                                    value="{{ product.quantity }}"
                                    min="0"
                                    required
                                >

                            </div>

                        </div>


                        <div class="row">

                            <!-- Unit -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label fw-semibold">
                                    Unit
                                </label>

                                <select
                                    name="unit"
                                    class="form-select"
                                >

                                    <option
                                        value="kg"
                                        {% if product.unit == "kg" %}selected{% endif %}
                                    >
                                        Kilogram (kg)
                                    </option>

                                    <option
                                        value="g"
                                        {% if product.unit == "g" %}selected{% endif %}
                                    >
                                        Gram (g)
                                    </option>

                                    <option
                                        value="litre"
                                        {% if product.unit == "litre" %}selected{% endif %}
                                    >
                                        Litre
                                    </option>

                                    <option
                                        value="piece"
                                        {% if product.unit == "piece" %}selected{% endif %}
                                    >
                                        Piece
                                    </option>

                                </select>

                            </div>


                            <!-- Category -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label fw-semibold">
                                    Category
                                </label>

                                <select
                                    name="category"
                                    class="form-select"
                                    required
                                >

                                    <option value="">
                                        Select Category
                                    </option>

                                    {% for category in categories %}

                                        <option
                                            value="{{ category.id }}"
                                            {% if product.category.id == category.id %}selected{% endif %}
                                        >
                                            {{ category.name }}
                                        </option>

                                    {% endfor %}

                                </select>

                            </div>

                        </div>


                        <!-- Current Image -->

                        {% if product.image %}

                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Current Image
                            </label>

                            <div>

                                <img
                                    src="{{ product.image.url }}"
                                    alt="{{ product.name }}"
                                    class="rounded"
                                    style="
                                        width: 150px;
                                        height: 150px;
                                        object-fit: cover;
                                    "
                                >

                            </div>

                        </div>

                        {% endif %}


                        <!-- New Image -->

                        <div class="mb-4">

                            <label class="form-label fw-semibold">
                                Change Product Image
                            </label>

                            <input
                                type="file"
                                name="image"
                                class="form-control"
                                accept="image/*"
                            >

                            <small class="text-muted">
                                Leave empty to keep the current image.
                            </small>

                        </div>


                        <!-- Buttons -->

                        <div class="d-flex gap-2">

                            <a
                                href="{% url 'farmer_products' %}"
                                class="btn btn-outline-secondary"
                            >
                                Cancel
                            </a>

                            <button
                                type="submit"
                                class="btn btn-success flex-grow-1"
                            >
                                💾 Update Product
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</section>

{% endblock %}
